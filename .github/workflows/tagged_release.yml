name: "Create Tagged Release"

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version number of the release'
        required: true

env:
  RELEASE_VERSION: ${{ inputs.release_version }}

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  gh_tagged_release:
    name: Create tagged release
    runs-on: ubuntu-latest

    permissions:
      contents: write # push the version commit and create the release

    steps:
      - name: Validate release version
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: $RELEASE_VERSION"
            exit 1
          fi

      - name: Checkout project
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # credentials are required to push the version commit
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Setup Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup NodeJs
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Set versions
        run: |
          release_branch_name=${RELEASE_VERSION%.*}.x
          echo "release_branch_name=$release_branch_name" >> "$GITHUB_ENV"

      - name: Set antora version
        run: yq eval -i '.version = strenv(RELEASE_VERSION)' documentation/js-sdk-aml-guide/antora.yml

      - name: Commit version changes and push to upstream repository
        run: |
          git add documentation/js-sdk-aml-guide/antora.yml
          if ! git diff --cached --quiet; then
            git commit --author "Author <actions@github.com>" -m "Apply automatic changes"
          fi
          git push origin "HEAD:refs/heads/$release_branch_name"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Set app version
        run: pnpm version "$RELEASE_VERSION" --no-git-tag-version

      - name: Build Project
        run: pnpm run build

      # This should be removed as soon as we go towards nodejs package repository
      - name: Pack Project as tgz
        run: pnpm pack

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$RELEASE_VERSION" == *-rc* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "v$RELEASE_VERSION" "esmf-sdk-js-$RELEASE_VERSION.tgz" \
            --target "$release_branch_name" \
            --title "v$RELEASE_VERSION" \
            --notes "Release version $RELEASE_VERSION." \
            "${prerelease[@]}"
