name: "Create Tagged Release"

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version number of the release'
        required: true
        
env:
  RELEASE_VERSION: ${{ github.event.inputs.release_version }}

permissions: {}

jobs:
  gh_tagged_release:
    name: Create tagged release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout project
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1

      - name: Setup Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup NodeJs
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # 6.1.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Set versions
        run: |
          release_branch_name=${RELEASE_VERSION%.*}.x
          echo "release_branch_name=$release_branch_name" >> $GITHUB_ENV

      - name: Set antora version
        run: yq eval -i '.version = "${{ env.RELEASE_VERSION }}"' documentation/js-sdk-aml-guide/antora.yml

      - name: Commit version changes and push to upstream repository
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          branch: ${{ env.release_branch_name }}
          commit_user_name: github-actions
          commit_user_email: github-actions@github.com
          commit_author: Author <actions@github.com>
          file_pattern: 'documentation/js-sdk-aml-guide/antora.yml'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Set app version (Unix)
        run: pnpm version ${{ env.RELEASE_VERSION }} --no-git-tag-version

      - name: Build Project
        run: pnpm run build

      # This should be removed as soon as we go towards nodejs package repository
      - name: Pack Project as tgz
        run: pnpm pack

      - name: "Create Github release (full)"
        if: ${{ !contains( env.RELEASE_VERSION, '-rc' ) }}
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v0.1.15
        id: esmf_sdk_js_aml_release
        with:
          body: "Release version ${{ env.RELEASE_VERSION }}."
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ env.release_branch_name }}
          draft: false
          prerelease: false
          files: esmf-sdk-js-${{ env.RELEASE_VERSION }}.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN  }}

      - name: "Create Github release (milestone)"
        if: contains( env.RELEASE_VERSION, '-rc' )
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v0.1.15
        id: sds_sdk_js_aml_release
        with:
          body: "Release version ${{ env.RELEASE_VERSION }}."
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ env.release_branch_name }}
          draft: false
          prerelease: true
          files: esmf-sdk-js-${{ env.RELEASE_VERSION }}.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN  }}
